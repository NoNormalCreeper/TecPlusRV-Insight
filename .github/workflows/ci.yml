name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 构建与仿真检查
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # rv32i 官方回归依赖 tests/riscv_tests/riscv-tests 及其 env 子模块。
          submodules: recursive

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            python3 \
            ffmpeg \
            iverilog \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf

      - name: Check env
        run: make check-env

      - name: Test
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            make ci-full
          else
            make ci
          fi

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-artifacts
          if-no-files-found: ignore
          path: |
            sim/build
            firmware/build
